<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>색상표현</title>
<style>
h1 {background-color: blue; }
p.a {background-color: #ff95ed;} p.b {background-color: #0078ff;}
p.c {background-color: #aa00ff;} p.d {background-color: #888888;}
p#a {background-color: #fff000;} p#b {background-color: #ff10ff;}
p#c {background-color: #f0101f;} p#d {background-color: #f01100;}
</style>
</head>
<body>
<h1>16진수 CSS 색상표현</h1>
<p class="a">Color #ff95ed;</p> <p class="b">Color #0078ff;</p>
<p class="c">Color #aa00ff;</p> <p class="d">Color #888888;</p>
<p id="a">Color #fff0000;</p> <p id="b">Color #fff10ff;</p>
<p id="c">Color #f0101f;</p> <p id="d">Color #f01100;</p>

</body></html>
