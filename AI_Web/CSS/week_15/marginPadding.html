<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Margin과 Padding 예제</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 250px;
            border: 3px solid black;
            background-color: lightblue;
        }

        .margin-box {
            margin: 50px;
        }

        .padding-box {
            padding: 50px;
        }
    </style>

</head>

<body>

    <h1>Margin 예제</h1>

    <div class="box margin-box">
        margin: 50px 적용
    </div>

    <hr>

    <h1>Padding 예제</h1>

    <div class="box padding-box">
        padding: 50px 적용
    </div>

</body>

</html>
