<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>예제5-4 인라인 스타일시트</title>
</head>

<body>
    <!-- 인라인 스타일로 글자색을 금색(gold)으로 설정 -->
    <h1 style="color: gold;">인라인 스타일시트</h1>

    <!-- 네비게이션 메뉴 영역 -->
    <div id="menu">
        <!-- 인라인 스타일로 배경색을 마젠타(magenta)로 설정 -->
        <p style="background-color: magenta;">
            <!-- 각 링크는 새 탭(target="_blank")으로 열림 -->
            <a href="../../HTML/week_7/hyperLink.html" target="_blank">하이퍼링크</a>
            &nbsp;<a href="../../HTML/week_12/verification.html" target="_blank">추가된 폼 속성</a>
            &nbsp;<a href="../../HTML/week_12/video.html" target="_blank">비디오</a>
        </p>
    </div>

    <!-- 인라인 스타일로 글자색을 분홍색(pink)으로 설정 -->
    <h1 style="color: pink;">HTML5와 CSS3</h1>

    <!-- 인라인 스타일로 배경색을 마젠타(magenta)로 설정 -->
    <p style="background-color: magenta;">
        이 문장은 인라인 스타일을 사용하여 배경색을 지정했습니다.
    </p>

    <!-- 소제목 -->
    <h2>하이퍼링크</h2>

    <!-- 일반 문단 (별도 스타일 없음) -->
    <p>스타일 적용 방법</p>
</body>

</html>
