<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>예제5-5 타입 선택자</title>
    <style>
        p {
            background-color: blue;
        }

        h1 {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>div와 iframe</h1>
    <div>
        <p>하이퍼링크</p>
    </div>

    <h1>Welcome to World Wide Web</h1>
    <p>HTML5에 CSS3를 연동하여 문서 디자인을 향상시킵니다.</p>

    <h2 style="background-color: orange;">메뉴</h2>
    <p>외부, 내부, 인라인 스타일 시트</p>
</body>

</html>
