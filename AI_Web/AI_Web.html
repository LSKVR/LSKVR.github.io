<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web 실습 파일</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --accent: #00d4aa;
            --accent2: #6c63ff;
            --accent3: #ff6b6b;
            --text: #e8e8f0;
            --text-muted: #8888aa;
            --border: rgba(0, 212, 170, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── 상단 네비 ── */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-back:hover {
            color: var(--accent);
        }

        .nav-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--accent);
        }

        .nav-badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid var(--border);
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* ── 헤더 ── */
        header {
            position: relative;
            z-index: 10;
            padding: 160px 40px 80px;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-badge {
            font-family: 'Syncopate', sans-serif;
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.2s forwards;
        }

        header h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.4s forwards;
        }

        .page-desc {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.6s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── 메인 컨텐츠 ── */
        main {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        /* ── 카테고리 카드 ── */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .category-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }

        .category-card:nth-child(1) { animation-delay: 0.1s; }
        .category-card:nth-child(2) { animation-delay: 0.2s; }
        .category-card:nth-child(3) { animation-delay: 0.3s; }

        .category-card:hover {
            border-color: rgba(0, 212, 170, 0.5);
            background: var(--surface2);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0, 212, 170, 0.1);
        }

        .card-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .card-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 18px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .category-card:hover .card-arrow {
            transform: translateX(4px);
            color: var(--accent);
        }

        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            border-top: 1px solid var(--border);
        }

        .footer-line {
            width: 40px;
            height: 1px;
            background: var(--accent);
            margin: 12px auto 0;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <nav class="top-nav">
        <a href="../index.html" class="nav-back">← 홈으로</a>
        <span class="nav-title">AI Web</span>
        <span class="nav-badge">웹호스팅</span>
    </nav>

    <header>
        <div class="page-badge">Practice Files</div>
        <h1>AI Web<br>웹호스팅</h1>
        <p class="page-desc">HTML · CSS · JavaScript 실습 파일 모음</p>
    </header>

    <main>
        <div class="category-grid">

            <a class="category-card" href="HTML/HTML.html">
                <span class="card-icon">🏷️</span>
                <div class="card-info">
                    <span class="card-title">HTML</span>
                    <span class="card-desc">태그 · 테이블 · 이미지 · 폼</span>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="category-card" href="CSS/CSS.html">
                <span class="card-icon">🎨</span>
                <div class="card-info">
                    <span class="card-title">CSS</span>
                    <span class="card-desc">스타일 · 레이아웃 · 애니메이션</span>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="category-card" href="JavaScript/JavaScript.html">
                <span class="card-icon">⚡</span>
                <div class="card-info">
                    <span class="card-title">JavaScript</span>
                    <span class="card-desc">변수 · 함수 · DOM 조작</span>
                </div>
                <span class="card-arrow">→</span>
            </a>

        </div>
    </main>

    <footer>
        <span>© 2026 이상경의 웹페이지</span>
        <div class="footer-line"></div>
    </footer>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W; this.y = Math.random() * H;
                this.r = Math.random() * 1.5 + 0.3;
                this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.5 ? '0,212,170' : '108,99,255';
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color},${this.alpha})`; ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animParticles() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0,212,170,${0.1 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animParticles);
        }
        animParticles();
    </script>

</body>

</html>
