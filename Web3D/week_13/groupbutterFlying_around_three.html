<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나비 숲속 애니메이션 - Three.js</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a3a1a; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
#info {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: rgba(255,255,255,0.5);
  font-family: sans-serif; pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">마우스로 시점 회전 | 스크롤로 줌</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a3a1a);
scene.fog = new THREE.FogExp2(0x1a3a1a, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 8, 28);
camera.lookAt(0, 5, 0);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

/* ── 조명 ── */
scene.add(new THREE.HemisphereLight(0x88ffaa, 0x224422, 0.8));
const sun = new THREE.DirectionalLight(0xffeeaa, 1.2);
sun.position.set(8, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x334433, 0.5));

/* ── 지면 ── */
function makeGround() {
  const geo = new THREE.PlaneGeometry(200, 200, 50, 50);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, Math.sin(x * 0.3) * 0.4 + Math.cos(z * 0.25) * 0.3);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x2d5a1b }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  scene.add(mesh);
}
makeGround();

/* ── 나무 ── */
function makeTree(x, z, h) {
  const trunkH = h * 0.45;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.28, trunkH, 7),
    new THREE.MeshLambertMaterial({ color: 0x3d2b1a })
  );
  trunk.position.set(x, trunkH / 2, z);
  trunk.castShadow = true;
  scene.add(trunk);

  for (let i = 0; i < 3; i++) {
    const r = h * 0.28 * (1 - i * 0.22);
    const yOff = trunkH * 0.65 + i * (h * 0.18);
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(r, h * 0.35, 7),
      new THREE.MeshLambertMaterial({ color: new THREE.Color(0x1a5a12).offsetHSL(0, 0, i * 0.06) })
    );
    cone.position.set(x, yOff, z);
    cone.castShadow = true;
    scene.add(cone);
  }
}

[
  [-12, -8, 7], [-18, -14, 8], [-6, -18, 6], [14, -10, 9], [20, -16, 7],
  [16, -5, 8],  [8, -20, 6],  [-20, -4, 9], [-14, -20, 7], [12, -22, 6],
  [-22, -18, 8],[22, -20, 7], [-4, -24, 7], [0, -22, 9],   [18, -2, 6],
  [-8, -6, 7],  [4, -14, 8],  [-16, -10, 6],[6, -8, 7],    [-10, -16, 8],
].forEach(([x, z, h]) => makeTree(x, z, h));

/* ── 양치식물 ── */
function makeFern(x, z) {
  const g = new THREE.SphereGeometry(0.5, 5, 4);
  g.scale(1.3, 0.6, 1.1);
  const mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x2a6a18 }));
  mesh.position.set(x, 0.3, z);
  scene.add(mesh);
}
for (let i = 0; i < 30; i++) makeFern((Math.random() - 0.5) * 36, (Math.random() - 0.5) * 36);

/* ── 햇살 빛줄기 ── */
const lightRays = [];
for (let i = 0; i < 6; i++) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.4, 8, 6, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffeeaa, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
  );
  const a = (i / 6) * Math.PI * 2;
  mesh.position.set(Math.cos(a) * 4, 12, Math.sin(a) * 4 - 4);
  mesh.rotation.z = (Math.random() - 0.5) * 0.3;
  scene.add(mesh);
  lightRays.push(mesh);
}

/* ── 텍스처 로드 ── */
const texLoader = new THREE.TextureLoader();
const texLeft  = texLoader.load('../../img/butter_left.gif');
const texRight = texLoader.load('../../img/butter_right.gif');
const texBody  = texLoader.load('../../img/butter_body.gif');

/* ── 나비 날개 Plane (텍스처용 사각형) ── */
function makeWingPlane(side) {
  // 왼날개: x=-1.15~-0.15, 오른날개: x=0.15~1.15, y=0~2 (원본 X3D 좌표 그대로)
  const geo = new THREE.PlaneGeometry(1.0, 2.0);
  if (side === 'L') geo.translate(-0.65, 1.0, 0);
  else              geo.translate( 0.65, 1.0, 0);
  return geo;
}

/* ── 나비 10마리 생성 ── */
const butterflies = [];
for (let i = 0; i < 10; i++) {
  const group = new THREE.Group();

  const lMat = new THREE.MeshBasicMaterial({ map: texLeft,  side: THREE.DoubleSide, transparent: true, alphaTest: 0.1 });
  const rMat = new THREE.MeshBasicMaterial({ map: texRight, side: THREE.DoubleSide, transparent: true, alphaTest: 0.1 });
  const bMat = new THREE.MeshBasicMaterial({ map: texBody,  side: THREE.DoubleSide, transparent: true, alphaTest: 0.1 });

  const lGroup = new THREE.Group();
  const rGroup = new THREE.Group();
  lGroup.add(new THREE.Mesh(makeWingPlane('L'), lMat));
  rGroup.add(new THREE.Mesh(makeWingPlane('R'), rMat));

  // 몸통: PlaneGeometry (원본 X3D: x=-0.35~0.35, y=0.65~1.65)
  const bodyGeo = new THREE.PlaneGeometry(0.7, 1.0);
  bodyGeo.translate(0, 1.15, 0.01);
  const body = new THREE.Mesh(bodyGeo, bMat);



  group.add(lGroup, rGroup, body);

  const angle = (i / 10) * Math.PI * 2;
  const rad   = 3 + Math.random() * 6;
  group.position.set(
    Math.cos(angle) * rad + (Math.random() - 0.5) * 4,
    4 + Math.random() * 8,
    Math.sin(angle) * rad + (Math.random() - 0.5) * 4 - 2
  );
  group.scale.setScalar(0.7 + Math.random() * 0.4);
  scene.add(group);

  butterflies.push({
    group, lGroup, rGroup,
    phase:       Math.random() * Math.PI * 2,
    speed:       0.8 + Math.random() * 0.8,
    orbitR:      2.5 + Math.random() * 5,
    orbitH:      3   + Math.random() * 6,
    orbitSpeed:  0.15 + Math.random() * 0.25,
    orbitPhase:  Math.random() * Math.PI * 2,
    orbitCX:     (Math.random() - 0.5) * 8,
    orbitCZ:     (Math.random() - 0.5) * 8 - 2,
    bobAmp:      0.4 + Math.random() * 0.6,
    bobSpeed:    0.7 + Math.random() * 0.6,
  });
}

/* ── 마우스 / 터치 카메라 조작 ── */
let mouse = { x: 0, y: 0, down: false };
let spherical = { theta: 0, phi: 0.3 };
let targetSpherical = { theta: 0, phi: 0.3 };
let zoom = 28;

canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseup',   () => mouse.down = false);
canvas.addEventListener('mousemove', e => {
  if (!mouse.down) return;
  targetSpherical.theta -= (e.clientX - mouse.x) * 0.005;
  targetSpherical.phi = Math.max(0.05, Math.min(1.4, targetSpherical.phi - (e.clientY - mouse.y) * 0.005));
  mouse.x = e.clientX; mouse.y = e.clientY;
});
canvas.addEventListener('wheel', e => {
  zoom = Math.max(8, Math.min(60, zoom + e.deltaY * 0.05));
  e.preventDefault();
}, { passive: false });

let touch = { x: 0, y: 0 };
canvas.addEventListener('touchstart', e => { touch.x = e.touches[0].clientX; touch.y = e.touches[0].clientY; });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    targetSpherical.theta -= (e.touches[0].clientX - touch.x) * 0.006;
    targetSpherical.phi = Math.max(0.05, Math.min(1.4, targetSpherical.phi - (e.touches[0].clientY - touch.y) * 0.006));
    touch.x = e.touches[0].clientX; touch.y = e.touches[0].clientY;
  }
  e.preventDefault();
}, { passive: false });

/* ── 애니메이션 루프 ── */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 카메라 구면좌표 이동
  spherical.theta += (targetSpherical.theta - spherical.theta) * 0.08;
  spherical.phi   += (targetSpherical.phi   - spherical.phi)   * 0.08;
  camera.position.set(
    zoom * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    zoom * Math.cos(spherical.phi) + 3,
    zoom * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 5, -2);

  // 나비 이동 & 날개짓
  butterflies.forEach(b => {
    const a  = t * b.orbitSpeed + b.orbitPhase;
    const tx = b.orbitCX + Math.cos(a) * b.orbitR;
    const tz = b.orbitCZ + Math.sin(a * 0.7) * b.orbitR * 0.6;
    const ty = b.orbitH  + Math.sin(t * b.bobSpeed + b.phase) * b.bobAmp;

    const prevX = b.group.position.x;
    const prevY = b.group.position.y;
    const prevZ = b.group.position.z;

    b.group.position.x += (tx - prevX) * 0.02;
    b.group.position.z += (tz - prevZ) * 0.02;
    b.group.position.y += (ty - prevY) * 0.02;

    // 수평 이동 벡터로 yaw(방향) 계산
    const dx = b.group.position.x - prevX;
    const dz = b.group.position.z - prevZ;
    const dy = b.group.position.y - prevY;
    const hSpeed = Math.sqrt(dx*dx + dz*dz);

    if (hSpeed > 0.0001) {
      // 진행 방향으로 yaw
      b.group.rotation.y = Math.atan2(dx, dz);
    }

    // pitch: 올라갈 때 머리 들고, 내려갈 때 앞으로 숙임 (실제 나비처럼)
    const targetPitch = -dy * 18 - 0.35; // 기본적으로 살짝 앞숙임
    b.pitch = (b.pitch || -0.35) + (targetPitch - (b.pitch || -0.35)) * 0.1;
    b.group.rotation.x = b.pitch;

    // roll: 좌우 회전시 방향으로 살짝 기울기
    const turnRate = dx; // 수평 이동량으로 롤
    const targetRoll = -turnRate * 12;
    b.roll = (b.roll || 0) + (targetRoll - (b.roll || 0)) * 0.08;
    b.group.rotation.z = b.roll;

    // 날개짓: 위로 올라갈 때 더 빠르게, 내려갈 때 느리게
    const flapSpeed = b.speed * 6 + (dy > 0 ? 2 : -1);
    const wingAngle = Math.sin(t * flapSpeed + b.phase) * 1.1;
    b.lGroup.rotation.y =  wingAngle;
    b.rGroup.rotation.y = -wingAngle;
  });

  // 빛줄기 깜빡임
  lightRays.forEach((r, i) => {
    r.material.opacity = 0.03 + Math.sin(t * 0.5 + i) * 0.015;
  });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
