<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wafer Fab 360 VR - Three.js WebXR</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; font-family: sans-serif; }
    #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; z-index: 10; pointer-events: none; }
  </style>
  <!-- Three.js 및 VRButton CDN Import -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <h2>반도체 웨이퍼 제조 공정 360 VR</h2>
    <p>아바타 중심 360도 배치 | 버튼을 1.5초간 바라보면 해당 장비로 회전합니다.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let scene, camera, renderer, cameraGroup;
    let reticle, raycaster;
    let interactiveObjects = [];
    let currentGazeTarget = null;
    let gazeTimer = 0;
    const GAZE_THRESHOLD = 90; // 60fps 기준 약 1.5초

    const RADIUS = 5; // 아바타 중심으로부터 장비까지의 거리 (미터)
    const STAGES_COUNT = 5;
    const stageNodes = [];

    init();

    function init() {
      // 1. Scene & Camera Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);
      scene.fog = new THREE.FogExp2(0x0d1117, 0.05);

      // 아바타/카메라 그룹 (중심에 위치)
      cameraGroup = new THREE.Group();
      cameraGroup.position.set(0, 1.6, 0); // 인간 눈높이 1.6m
      scene.add(cameraGroup);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      cameraGroup.add(camera);

      // 2. Renderer & WebXR Setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // 3. Ambient & Direct Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // 바닥 격자 링
      const grid = new THREE.GridHelper(20, 20, 0x00ffff, 0x333333);
      grid.position.y = 0;
      scene.add(grid);

      // 4. Central Gaze Reticle (시선 포인터)
      const reticleGeo = new THREE.RingGeometry(0.01, 0.02, 32);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, depthTest: false });
      reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.position.z = -1; // 카메라 앞 1m
      reticle.renderOrder = 999;
      camera.add(reticle);

      raycaster = new THREE.Raycaster();

      // 5. Create 5 Stages arranged in a Circle around Avatar
      const stageTitles = [
        "1. 잉곳 성장 (Ingot Growth)",
        "2. 와이어 절단 (Wire Slicing)",
        "3. 랩핑/면취 (Edge & Lapping)",
        "4. CMP 정밀연마 (CMP Polishing)",
        "5. 레이저 검사 (Laser Inspection)"
      ];

      for (let i = 0; i < STAGES_COUNT; i++) {
        const angle = (i / STAGES_COUNT) * Math.PI * 2; // 원형 360도 배치 각도
        const x = Math.sin(angle) * RADIUS;
        const z = -Math.cos(angle) * RADIUS;

        // 장비 거치대 그룹
        const stageGroup = new THREE.Group();
        stageGroup.position.set(x, 0, z);
        stageGroup.lookAt(0, 0, 0); // 중심 아바타를 바라보도록 설정

        // 받침대 (Podium)
        const baseGeo = new THREE.CylinderGeometry(0.8, 1.0, 0.4, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x22272e, metalness: 0.5 });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = 0.2;
        stageGroup.add(baseMesh);

        // 단계별 장비 3D 모델 및 애니메이션 노드 생성
        const equipment = createEquipmentMesh(i);
        equipment.position.y = 0.9;
        stageGroup.add(equipment);

        // 3D Spatial UI 버튼 (장비 위에 떠있음)
        const btnGeo = new THREE.BoxGeometry(1.2, 0.3, 0.1);
        const btnMat = new THREE.MeshStandardMaterial({ color: 0x007acc, emissive: 0x003366 });
        const btnMesh = new THREE.Mesh(btnGeo, btnMat);
        btnMesh.position.set(0, 1.8, 0);
        btnMesh.userData = { stageIndex: i, title: stageTitles[i], angle: angle };
        stageGroup.add(btnMesh);

        interactiveObjects.push(btnMesh);
        scene.add(stageGroup);

        stageNodes.push({ group: stageGroup, equipment: equipment, stageIndex: i });
      }

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    // 단계별 장비 프라이머리 3D 메쉬 생성 함수
    function createEquipmentMesh(index) {
      const group = new THREE.Group();
      if (index === 0) {
        // Stage 1: Ingot Growth Vat & Silicon Cylinder
        const vat = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.6, 16), new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xaa2200 }));
        const ingot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
        ingot.position.y = 0.5;
        group.add(vat, ingot);
      } else if (index === 1) {
        // Stage 2: Wire Slicing Grid & Ingot
        const ingot = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.9, 16), new THREE.MeshStandardMaterial({ color: 0x777777 }));
        ingot.rotation.z = Math.PI / 2;
        group.add(ingot);
      } else if (index === 2) {
        // Stage 3: Lapping Plates
        const topPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        const bottomPlate = topPlate.clone();
        topPlate.position.y = 0.2;
        bottomPlate.position.y = -0.2;
        group.add(topPlate, bottomPlate);
      } else if (index === 3) {
        // Stage 4: CMP Mirror Wafer
        const wafer = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.05 }));
        group.add(wafer);
      } else if (index === 4) {
        // Stage 5: Laser Inspection Beam
        const wafer = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 }));
        const laser = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.02, 0.02), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
        laser.position.y = 0.15;
        group.add(wafer, laser);
      }
      return group;
    }

    // 시선(Gaze Pointer) Raycasting 및 타이머 로직
    function updateGaze() {
      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const target = intersects[0].object;
        if (currentGazeTarget !== target) {
          currentGazeTarget = target;
          gazeTimer = 0;
        }

        gazeTimer++;
        const progress = Math.min(gazeTimer / GAZE_THRESHOLD, 1);
        reticle.scale.set(1 + progress, 1 + progress, 1);
        reticle.material.color.setHSL(0.3 * progress, 1, 0.5); // 파란색 -> 초록색 변환

        if (gazeTimer >= GAZE_THRESHOLD) {
          onSelectStage(target.userData);
          gazeTimer = 0;
        }
      } else {
        currentGazeTarget = null;
        gazeTimer = 0;
        reticle.scale.set(1, 1, 1);
        reticle.material.color.set(0x00ffff);
      }
    }

    // 선택된 장비 방향으로 카메라/아바타 회전
    function onSelectStage(data) {
      const targetAngle = -data.angle;
      cameraGroup.rotation.y = targetAngle; // 선택된 장비 정면을 바라보도록 링 회전
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // WebXR 메인 애니메이션 루프
    function render(time) {
      updateGaze();

      // 5개 장비 연속 회전 애니메이션
      stageNodes.forEach((node) => {
        node.equipment.rotation.y += 0.01;
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
