    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

</script>

    <meta name="description" content="EOCR 보호회로의 결선, 가상 과부하 트립, 복귀 과정을 체험하는 Three.js 교육용 시뮬레이터" />

    <script type="module">
// src/simulator.ts
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
var palette = {
  board: 1319967,
  boardEdge: 2374452,
  dark: 1056795,
  green: 6152366,
  amber: 16762219,
  red: 16739170,
  wireR: 15691883,
  wireS: 16041566,
  wireT: 6597119,
  wireControl: 6740138,
  dim: 5730664
};
function roundedLabel(text, options = {}) {
  const width = options.width ?? 512;
  const canvas2 = document.createElement("canvas");
  canvas2.width = width;
  canvas2.height = 128;
  const ctx = canvas2.getContext("2d");
  if (!ctx) throw new Error("Canvas text context is unavailable.");
  ctx.clearRect(0, 0, canvas2.width, canvas2.height);
  ctx.fillStyle = options.fill ?? "#10201b";
  ctx.beginPath();
  ctx.roundRect(8, 8, width - 16, 112, 22);
  ctx.fill();
  ctx.strokeStyle = "rgba(164, 214, 195, .25)";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = options.color ?? "#e7f3ed";
  ctx.font = '600 38px Inter, "Noto Sans KR", sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, width / 2, 66, width - 42);
  const texture = new THREE.CanvasTexture(canvas2);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false });
  return new THREE.Mesh(new THREE.PlaneGeometry(width / 230, 0.56), material);
}
var EocrScene = class {
  constructor(canvas2, onReady) {
    this.canvas = canvas2;
    this.onReady = onReady;
    this.renderer = new THREE.WebGLRenderer({ canvas: canvas2, antialias: true, alpha: true, powerPreference: "high-performance" });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.15;
    this.scene.background = new THREE.Color("#0c1714");
    this.camera.position.set(0.2, 0.05, 11.8);
    this.controls = new OrbitControls(this.camera, canvas2);
    this.controls.target.set(0, 0, 0);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.065;
    this.controls.enablePan = false;
    this.controls.minDistance = 8.6;
    this.controls.maxDistance = 15;
    this.controls.maxPolarAngle = Math.PI * 0.61;
    this.controls.minPolarAngle = Math.PI * 0.39;
    this.scene.add(new THREE.HemisphereLight(12185815, 1187865, 2.1));
    const keyLight = new THREE.DirectionalLight(16777215, 2.5);
    keyLight.position.set(-3, 5, 8);
    this.scene.add(keyLight);
    const rimLight = new THREE.PointLight(3784595, 22, 14, 2);
    rimLight.position.set(4, 0, 4);
    this.scene.add(rimLight);
    this.buildPanel();
    this.scene.add(this.currentFlow);
    this.buildCurrentFlowParticles();
    this.greenLed = this.makeLed(-2.62, 0.75, 1.02, 4249762);
    this.tripLed = this.makeLed(-2.26, 0.75, 1.02, 16735573);
    this.contactorFace = this.makeBox(1.05, 0.53, 0.09, 3235664, -0.03, 0.05, 1);
    this.scene.add(this.controlWires);
    this.update(this.state);
    this.onReady?.(true);
    this.resize();
    window.addEventListener("resize", this.resize);
    this.renderer.setAnimationLoop(this.render);
  }
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(37, 1, 0.1, 80);
  renderer;
  controls;
  clock = new THREE.Clock();
  rotor = new THREE.Group();
  currentFlow = new THREE.Group();
  currentPaths = [];
  currentParticles = [];
  greenLed;
  tripLed;
  contactorFace;
  displayCanvas;
  displayTexture;
  controlWires = new THREE.Group();
  state = {
    running: false,
    eocrTripped: false,
    overloaded: false,
    settingA: 4,
    currentA: 0,
    wiringMode: "connected"
  };
  update(next) {
    this.state = { ...next };
    this.drawControlCircuit();
    this.updateDisplay();
    const powerFlow = this.state.running && (!this.state.eocrTripped || this.state.wiringMode === "disconnected");
    this.currentFlow.visible = powerFlow;
    const flowColor = this.state.overloaded || this.state.eocrTripped ? palette.red : palette.green;
    for (const { mesh } of this.currentParticles) {
      const material = mesh.material;
      material.color.setHex(flowColor);
      material.emissive.setHex(flowColor);
    }
    const contactClosed = this.state.wiringMode === "connected" && !this.state.eocrTripped;
    const greenMaterial = this.greenLed.material;
    greenMaterial.emissiveIntensity = this.state.running && !this.state.eocrTripped ? 2.3 : 0.2;
    const redMaterial = this.tripLed.material;
    redMaterial.emissiveIntensity = this.state.eocrTripped ? 2.8 : 0.12;
    const faceMaterial = this.contactorFace.material;
    faceMaterial.color.set(this.state.running ? contactClosed ? "#3e876b" : "#f0a144" : "#315f50");
    faceMaterial.emissive.set(this.state.running ? contactClosed ? "#174d39" : "#66320c" : "#08120e");
    faceMaterial.emissiveIntensity = this.state.running ? 0.8 : 0.1;
  }
  resetCamera() {
    this.controls.target.set(0, 0, 0);
    this.camera.position.set(0.2, 0.05, 11.8);
    this.controls.update();
  }
  dispose() {
    this.renderer.setAnimationLoop(null);
    this.renderer.dispose();
    this.controls.dispose();
    window.removeEventListener("resize", this.resize);
    this.onReady?.(false);
  }
  buildPanel() {
    const backplate = this.makeBox(8.45, 4.85, 0.28, palette.board, 0, 0, -0.25);
    this.scene.add(backplate);
    const inner = this.makeBox(8.1, 4.5, 0.035, palette.dark, 0, 0, -0.07);
    this.scene.add(inner);
    this.addCornerScrews();
    const header = roundedLabel("EOCR \uBCF4\uD638 \uD68C\uB85C \xB7 TRAINING PANEL", { fill: "#233b33", color: "#cfe8dc" });
    header.position.set(0, 1.95, 0.015);
    this.scene.add(header);
    const phaseYs = [1.42, 1.2, 0.98];
    const phaseColors = [palette.wireR, palette.wireS, palette.wireT];
    const phaseNames = ["R", "S", "T"];
    phaseYs.forEach((y, i) => {
      this.addTerminal(-3.53, y, phaseColors[i], phaseNames[i]);
      const phasePath = [
        [-3.37, y, 0.18],
        [-3.05, y, 0.18],
        [-2.95, y - 0.11, 0.18],
        [-2.95, -0.93, 0.18],
        [-1.42, -0.93, 0.18],
        [-1.25, y - 0.03, 0.18],
        [-0.83, y - 0.03, 0.18],
        [-0.72, -0.82, 0.18],
        [1.25, -0.82, 0.18],
        [1.69, -0.45, 0.18]
      ];
      this.addCable(phasePath, phaseColors[i], 0.035);
      this.currentPaths.push(new THREE.CatmullRomCurve3(phasePath.map(([x, y2, z]) => new THREE.Vector3(x, y2, z))));
    });
    const eocr = this.makeBox(1.55, 1.95, 0.64, 2312765, -2.08, 0.28, 0.28);
    this.scene.add(eocr);
    const eocrScreen = this.makeBox(0.92, 0.48, 0.045, 529423, -2.08, 0.29, 0.66);
    this.scene.add(eocrScreen);
    const screenText = this.createDisplay();
    this.scene.add(screenText);
    const eocrLabel = roundedLabel("EOCR \xB7 95 / 96", { fill: "#12241e", color: "#d7ede2" });
    eocrLabel.scale.set(0.92, 0.52, 1);
    eocrLabel.position.set(-2.08, -0.36, 0.66);
    this.scene.add(eocrLabel);
    this.addKnob(-2.08, -0.78, 0.69, 4958592);
    const contactor = this.makeBox(1.58, 1.95, 0.7, 2702134, -0.05, 0.28, 0.25);
    this.scene.add(contactor);
    const contactorLabel = roundedLabel("\uC811\uCD09\uAE30 \xB7 KM", { fill: "#17241f", color: "#dce9e3" });
    contactorLabel.scale.set(0.95, 0.54, 1);
    contactorLabel.position.set(-0.05, 0.73, 0.63);
    this.scene.add(contactorLabel);
    const coilBadge = roundedLabel("A1  \u2500  A2", { fill: "#17241f", color: "#a4c6b7" });
    coilBadge.scale.set(0.76, 0.48, 1);
    coilBadge.position.set(-0.05, -0.68, 0.63);
    this.scene.add(coilBadge);
    this.addContactorContacts(-0.05, 0.18, 0.66);
    const motorBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.72, 0.78, 1.28, 36, 1),
      new THREE.MeshStandardMaterial({ color: 5402724, metalness: 0.72, roughness: 0.31 })
    );
    motorBody.rotation.x = Math.PI / 2;
    motorBody.position.set(2.45, -0.48, 0.45);
    this.scene.add(motorBody);
    const rearRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.62, 0.055, 10, 44),
      new THREE.MeshStandardMaterial({ color: 9283995, metalness: 0.78, roughness: 0.24 })
    );
    rearRing.position.set(2.45, -0.48, 1.13);
    this.scene.add(rearRing);
    const rotorDisk = new THREE.Mesh(
      new THREE.CircleGeometry(0.52, 36),
      new THREE.MeshStandardMaterial({ color: 2376248, metalness: 0.32, roughness: 0.5, side: THREE.DoubleSide })
    );
    this.rotor.position.set(2.45, -0.48, 1.155);
    rotorDisk.position.set(0, 0, 0);
    this.rotor.add(rotorDisk);
    for (let i = 0; i < 3; i += 1) {
      const blade = this.makeBox(0.12, 0.72, 0.035, 9099445, 0, 0, 0.015);
      blade.rotation.z = Math.PI * 2 * i / 3;
      this.rotor.add(blade);
    }
    const hub = new THREE.Mesh(new THREE.CircleGeometry(0.12, 24), new THREE.MeshStandardMaterial({ color: 12969172, metalness: 0.6, roughness: 0.25 }));
    hub.position.set(0, 0, 0.035);
    this.rotor.add(hub);
    this.scene.add(this.rotor);
    const shaft = this.makeBox(0.14, 0.14, 0.42, 10336170, 2.45, -0.48, 1.42);
    this.scene.add(shaft);
    const motorLabel = roundedLabel("\uBAA8\uD130 \xB7 M", { fill: "#13241e", color: "#dceee5" });
    motorLabel.scale.set(0.9, 0.52, 1);
    motorLabel.position.set(2.45, -1.52, 0.58);
    this.scene.add(motorLabel);
    this.addBottomLegend();
    this.addBackgroundDetails();
  }
  buildCurrentFlowParticles() {
    const geometry = new THREE.SphereGeometry(0.052, 12, 10);
    this.currentPaths.forEach((_, pathIndex) => {
      for (let particleIndex = 0; particleIndex < 4; particleIndex += 1) {
        const material = new THREE.MeshStandardMaterial({ color: palette.green, emissive: palette.green, emissiveIntensity: 2.1, roughness: 0.25 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.visible = false;
        this.currentFlow.add(mesh);
        this.currentParticles.push({ mesh, pathIndex, offset: particleIndex / 4 });
      }
    });
  }
  addCornerScrews() {
    for (const x of [-4.05, 4.05]) {
      for (const y of [-2.25, 2.25]) {
        const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.025, 18), new THREE.MeshStandardMaterial({ color: 7704965, metalness: 0.8, roughness: 0.25 }));
        screw.rotation.x = Math.PI / 2;
        screw.position.set(x, y, -0.055);
        this.scene.add(screw);
      }
    }
  }
  addTerminal(x, y, color, label) {
    const block = this.makeBox(0.26, 0.24, 0.2, 2110766, x, y, 0.21);
    this.scene.add(block);
    const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.035, 16), new THREE.MeshStandardMaterial({ color: 11256247, metalness: 0.85, roughness: 0.2 }));
    screw.rotation.x = Math.PI / 2;
    screw.position.set(x, y, 0.33);
    this.scene.add(screw);
    const tag = roundedLabel(label, { fill: "#16241f", color: `#${color.toString(16).padStart(6, "0")}`, width: 170 });
    tag.scale.set(0.25, 0.26, 1);
    tag.position.set(x, y + 0.21, 0.34);
    this.scene.add(tag);
  }
  addKnob(x, y, z, color) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.035, 10, 24), new THREE.MeshStandardMaterial({ color: 10007719, metalness: 0.72, roughness: 0.3 }));
    ring.position.set(x, y, z);
    this.scene.add(ring);
    const center = new THREE.Mesh(new THREE.CircleGeometry(0.115, 24), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.16 }));
    center.position.set(x, y, z + 0.012);
    this.scene.add(center);
    const pointer = this.makeBox(0.025, 0.12, 0.025, 14873834, x, y + 0.035, z + 0.03);
    this.scene.add(pointer);
  }
  addContactorContacts(x, y, z) {
    for (let i = 0; i < 3; i += 1) {
      const contact = this.makeBox(0.19, 0.38, 0.04, 10336940, x - 0.48 + i * 0.48, y, z);
      this.scene.add(contact);
      const terminal = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.025, 14), new THREE.MeshStandardMaterial({ color: 14149341, metalness: 0.8, roughness: 0.2 }));
      terminal.rotation.x = Math.PI / 2;
      terminal.position.set(x - 0.48 + i * 0.48, y + 0.25, z + 0.03);
      this.scene.add(terminal);
    }
  }
  addBottomLegend() {
    const labels = [
      { text: "L  \uC81C\uC5B4\uC804\uC6D0", x: -3.08 },
      { text: "\uC815\uC9C0 NC", x: -1.98 },
      { text: "EOCR 95\u201396", x: -0.55 },
      { text: "KM \uCF54\uC77C", x: 1 },
      { text: "N", x: 3.02 }
    ];
    labels.forEach(({ text, x }) => {
      const tag = roundedLabel(text, { fill: "#172a23", color: "#c1d9cc", width: 300 });
      tag.scale.set(0.78, 0.38, 1);
      tag.position.set(x, -1.77, 0.04);
      this.scene.add(tag);
    });
  }
  addBackgroundDetails() {
    for (let i = 0; i < 18; i += 1) {
      const line = this.makeBox(0.025, 0.16, 0.018, 3494472, -3.72 + i * 0.43, 1.9, 5e-3);
      this.scene.add(line);
    }
    const edge = this.makeBox(7.92, 0.018, 0.025, 3561034, 0, -2.06, 0.02);
    this.scene.add(edge);
  }
  makeLed(x, y, z, color) {
    const led = new THREE.Mesh(
      new THREE.SphereGeometry(0.085, 18, 12),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.12, roughness: 0.22 })
    );
    led.position.set(x, y, z);
    this.scene.add(led);
    return led;
  }
  drawControlCircuit() {
    for (const child of this.controlWires.children) {
      if (child instanceof THREE.Mesh) {
        child.geometry.dispose();
        if (Array.isArray(child.material)) child.material.forEach((material) => material.dispose());
        else child.material.dispose();
      }
    }
    this.controlWires.clear();
    const controlColor = this.state.running ? this.state.eocrTripped && this.state.wiringMode === "disconnected" ? palette.red : palette.wireControl : palette.dim;
    this.addCable([[-3.58, -1.25, 0.42], [-2.56, -1.25, 0.42], [-2.4, -1.39, 0.42]], controlColor, 0.045, this.controlWires);
    if (this.state.wiringMode === "connected") {
      if (!this.state.eocrTripped) {
        this.addCable([[-2.4, -1.39, 0.42], [-1.66, -1.39, 0.42], [-1.45, -1.25, 0.42], [-0.08, -1.25, 0.42], [0.45, -1.25, 0.42], [2.95, -1.25, 0.42]], controlColor, 0.045, this.controlWires);
      } else {
        this.addCable([[-2.4, -1.39, 0.42], [-2.18, -1.39, 0.42]], palette.red, 0.045, this.controlWires);
        this.addCable([[-1.78, -1.39, 0.42], [-1.45, -1.25, 0.42]], palette.dim, 0.035, this.controlWires);
        this.addCable([[-1.98, -1.58, 0.42], [-1.98, -1.78, 0.42]], palette.red, 0.035, this.controlWires);
      }
    } else {
      this.addCable([[-2.4, -1.39, 0.42], [-2.16, -1.39, 0.42]], palette.red, 0.04, this.controlWires);
      this.addCable([[-1.78, -1.39, 0.42], [-1.45, -1.25, 0.42], [-0.08, -1.25, 0.42], [0.45, -1.25, 0.42], [2.95, -1.25, 0.42]], controlColor, 0.045, this.controlWires);
    }
  }
  addCable(points, color, radius = 0.035, group = this.scene) {
    const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    const geometry = new THREE.TubeGeometry(curve, Math.max(18, points.length * 10), radius, 7, false);
    const material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.26, roughness: 0.42, metalness: 0.08 });
    group.add(new THREE.Mesh(geometry, material));
  }
  createDisplay() {
    this.displayCanvas = document.createElement("canvas");
    this.displayCanvas.width = 360;
    this.displayCanvas.height = 128;
    this.displayTexture = new THREE.CanvasTexture(this.displayCanvas);
    this.displayTexture.colorSpace = THREE.SRGBColorSpace;
    const display = new THREE.Mesh(
      new THREE.PlaneGeometry(0.92, 0.48),
      new THREE.MeshBasicMaterial({ map: this.displayTexture })
    );
    display.position.set(-2.08, 0.3, 0.693);
    this.updateDisplay();
    return display;
  }
  updateDisplay() {
    const context = this.displayCanvas?.getContext("2d");
    if (!context || !this.displayTexture) return;
    context.fillStyle = "#081a12";
    context.fillRect(0, 0, this.displayCanvas.width, this.displayCanvas.height);
    context.strokeStyle = "rgba(105, 210, 159, .45)";
    context.lineWidth = 4;
    context.strokeRect(5, 5, this.displayCanvas.width - 10, this.displayCanvas.height - 10);
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = '500 25px "DM Mono", monospace';
    context.fillStyle = "#6eab8c";
    context.fillText(this.state.eocrTripped ? "TRIP" : "SET POINT", 180, 39);
    context.font = '600 45px "DM Mono", monospace';
    context.fillStyle = this.state.eocrTripped ? "#ff7770" : "#96f2c2";
    context.fillText(this.state.eocrTripped ? "ALARM" : `${this.state.settingA.toFixed(1)} A`, 180, 88);
    this.displayTexture.needsUpdate = true;
  }
  makeBox(width, height, depth, color, x, y, z) {
    return new THREE.Mesh(
      new THREE.BoxGeometry(width, height, depth),
      new THREE.MeshStandardMaterial({ color, metalness: 0.2, roughness: 0.47 })
    ).translateX(x).translateY(y).translateZ(z);
  }
  resize = () => {
    const bounds = this.canvas.getBoundingClientRect();
    if (bounds.width < 1 || bounds.height < 1) return;
    this.renderer.setSize(bounds.width, bounds.height, false);
    this.camera.aspect = bounds.width / bounds.height;
    this.camera.updateProjectionMatrix();
  };
  render = () => {
    const delta = Math.min(this.clock.getDelta(), 0.05);
    if (this.state.running) this.rotor.rotation.z += delta * (this.state.overloaded ? 6.5 : 3.4);
    const powerFlow = this.state.running && (!this.state.eocrTripped || this.state.wiringMode === "disconnected");
    const flowTime = this.clock.elapsedTime * (this.state.overloaded ? 0.48 : 0.3);
    for (const { mesh, pathIndex, offset } of this.currentParticles) {
      mesh.visible = powerFlow;
      if (powerFlow) mesh.position.copy(this.currentPaths[pathIndex].getPointAt((flowTime + offset) % 1));
    }
    this.contactorFace.position.y = this.state.running ? 0.02 : 0.05;
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  };
};

if (!app) throw new Error("Application root was not found.");
app.innerHTML = `
  <div class="app-shell">

      <div class="topbar-center"><span class="live-dot"></span> \uBE0C\uB77C\uC6B0\uC800 \uC2DC\uBBAC\uB808\uC774\uC158 <span class="topbar-divider">/</span> \uC7A5\uBE44 \uC5F0\uACB0 \uC5C6\uC74C</div>
      <div class="lesson-chip"><span>\uC2E4\uC2B5</span><strong>06</strong><span class="chip-line"></span><span>\uBCF4\uD638 \uACC4\uC804</span></div>

    <main id="top">

var canvas = document.querySelector("#panelCanvas");
var scene = new EocrScene(canvas);
var settingInput = document.querySelector("#currentSetting");
var currentValue = document.querySelector("#currentValue");
var sceneCurrent = document.querySelector("#sceneCurrent");
var meterFill = document.querySelector("#currentMeterFill");
var messageBox = document.querySelector("#messageBox");
var messageTitle = document.querySelector("#messageTitle");
var messageText = document.querySelector("#messageText");
var stateTag = document.querySelector("#stateTag");
var sceneState = document.querySelector("#sceneState");
var currentStatus = document.querySelector("#currentStatus");
var startButton = document.querySelector("#startButton");
var stopButton = document.querySelector("#stopButton");
var overloadButton = document.querySelector("#overloadButton");
var resetButton = document.querySelector("#resetButton");
var wiringSelect = document.querySelector("#wiringMode");
var NOMINAL_A = 4;
var NORMAL_A = 3.4;
var OVERLOAD_A = 6.6;
var settingA = 4;
var wiringMode = "connected";
var running = false;
var eocrTripped = false;
var overloaded = false;
var hasRun = false;
var hasTripped = false;
var hasReset = false;
var messageTone = "neutral";
var messageHeading = "\uC2E4\uC2B5 \uC900\uBE44 \uC644\uB8CC";
var messageBody = "\uC811\uC810 \uACB0\uC120\uACFC \uC124\uC815\uAC12\uC744 \uD655\uC778\uD558\uACE0 \uAE30\uB3D9\uD558\uC138\uC694.";
function updateMessage(title, body, tone) {
  messageHeading = title;
  messageBody = body;
  messageTone = tone;
}
function getCurrent() {
  return running ? overloaded ? OVERLOAD_A : NORMAL_A : 0;
}
function refresh() {
  const current = getCurrent();
  const state = { running, eocrTripped, overloaded, settingA, currentA: current, wiringMode };
  scene.update(state);
  document.querySelector("#settingValue").textContent = settingA.toFixed(1);
  document.querySelector("#settingValue").closest(".setting-value").classList.toggle("setting-high", settingA > OVERLOAD_A);
  currentValue.innerHTML = `${current.toFixed(1)} <small>A</small>`;
  sceneCurrent.innerHTML = `${current.toFixed(1)}<small> A</small>`;
  meterFill.style.width = `${Math.min(current / 8, 1) * 100}%`;
  meterFill.classList.toggle("meter-danger", current > NOMINAL_A);
  document.querySelector("#messageIcon").textContent = messageTone === "good" ? "\u2713" : messageTone === "warning" ? "!" : messageTone === "danger" ? "\xD7" : "i";
  messageBox.dataset.tone = messageTone;
  messageTitle.textContent = messageHeading;
  messageText.textContent = messageBody;
  const risk = running && overloaded || running && eocrTripped;
  const stateText = eocrTripped && !running ? "\uD2B8\uB9BD \uB798\uCE58" : risk ? "\uBCF4\uD638 \uBBF8\uCC28\uB2E8" : running ? overloaded ? "\uACFC\uBD80\uD558" : "\uC815\uC0C1 \uC6B4\uC804" : "\uB300\uAE30";
  stateTag.textContent = stateText;
  stateTag.className = `state-tag ${risk ? "is-danger" : eocrTripped ? "is-warning" : running ? "is-running" : ""}`;
  sceneState.innerHTML = `<i></i> ${stateText}`;
  sceneState.className = `scene-state ${risk ? "is-danger" : eocrTripped ? "is-warning" : running ? "is-running" : ""}`;
  currentStatus.textContent = risk ? "\uC8FC\uC758 \uD544\uC694" : running ? "\uC6B4\uC804 \uC911" : "\uC815\uC9C0";
  startButton.disabled = running || eocrTripped;
  stopButton.disabled = !running;
  overloadButton.disabled = !running || overloaded;
  resetButton.disabled = !eocrTripped || running;
  settingInput.disabled = running;
  wiringSelect.disabled = running;
  document.querySelector("#circuitDiagram").dataset.wiring = wiringMode;
  document.querySelector("#circuitDiagram").dataset.energized = String(running);
  document.querySelector("#circuitDiagram").dataset.tripped = String(eocrTripped);
  document.querySelector("#diagramLed").classList.toggle("led-on", running && !eocrTripped);
  document.querySelector("#diagramLed").classList.toggle("led-trip", eocrTripped);
  document.querySelector("#eocrContactSymbol").classList.toggle("contact-open", eocrTripped && wiringMode === "connected");
  const stepProgress = [
    { selector: '[data-step="wiring"]', complete: wiringMode === "connected" },
    { selector: '[data-step="setting"]', complete: Math.abs(settingA - NOMINAL_A) < 0.05 },
    { selector: '[data-step="trip"]', complete: hasRun && hasTripped },
    { selector: '[data-step="reset"]', complete: hasReset }
  ];
  stepProgress.forEach(({ selector, complete }) => {
    const step = document.querySelector(selector);
    step.classList.toggle("is-complete", complete);
    step.querySelector(".step-check").textContent = complete ? "\u2713" : "\u25CB";
  });
  document.querySelector("#completeCount").textContent = String(stepProgress.filter(({ complete }) => complete).length);
  document.querySelector("#ratedPreset").classList.toggle("is-selected", Math.abs(settingA - NOMINAL_A) < 0.05);
  document.querySelector("#highPreset").classList.toggle("is-selected", Math.abs(settingA - 8) < 0.05);
}
startButton.addEventListener("click", () => {
  if (eocrTripped) return;
  hasRun = true;
  overloaded = false;
  if (settingA <= NORMAL_A) {
    running = false;
    eocrTripped = true;
    hasTripped = true;
    updateMessage("\uC124\uC815\uAC12\uC774 \uB0AE\uC544 \uBD88\uD544\uC694 \uD2B8\uB9BD", `\uC815\uC0C1 \uBAA8\uC758 \uC6B4\uC804\uC804\uB958 ${NORMAL_A.toFixed(1)} A\uAC00 \uC124\uC815 ${settingA.toFixed(1)} A\uB97C \uB118\uC5C8\uC2B5\uB2C8\uB2E4. \uC815\uACA9 \uC608\uC2DC\uAC12\uC73C\uB85C \uC870\uC815\uD55C \uB4A4 \uBCF5\uADC0\uD558\uC138\uC694.`, "warning");
  } else {
