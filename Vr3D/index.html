<script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ================= CONFIG : 배치는 데이터 (x,z,ry 수정으로 설계도에 맞춰 조정) ================= */
const ROOM={w:22,d:17,h:4.5},EYE=1.65;
const EQ=[
{id:'LoadPort',ko:'로드 포트',en:'Wafer Load Port',no:'LP-01',x:-9.4,z:-4.2,ry:90,b:loadPort,k:['STATUS','FOUP','POWER'],d:'FOUP을 도킹해 웨이퍼를 공정실로 투입하는 인터페이스'},
{id:'CassetteStation',ko:'카세트 스테이션',no:'CS-01',x:-9.4,z:0.2,ry:90,b:cassette,k:['STATUS','SLOT','POWER'],d:'웨이퍼 카세트를 보관하고 대기시키는 스테이션'},
{id:'WaferUnloader',ko:'웨이퍼 언로더',no:'UL-01',x:-9.3,z:4.6,ry:90,b:unloader,k:['STATUS','FOUP','POWER'],d:'공정이 끝난 웨이퍼를 FOUP으로 반출하는 장치'},
{id:'OxidationFurnace',ko:'산화 장비',no:'FRN-01',x:0,z:-6.9,ry:0,b:furnace,k:['STATUS','TEMP','PRESS','POWER','GAS'],d:'웨이퍼 표면에 산화막을 형성하는 핵심 공정 장비'},
{id:'Inspection',ko:'검사 장비',no:'INS-01',x:9.3,z:-3.9,ry:-90,b:inspection,k:['STATUS','STAGE','POWER'],d:'광학계로 웨이퍼 표면 상태를 검사하는 장비'},
{id:'TransferRobot',ko:'반송 로봇',no:'RB-01',x:9.2,z:2.4,ry:-90,b:robot,k:['STATUS','AXIS','POWER'],d:'웨이퍼를 장비 사이로 반송하는 다관절 로봇'},
{id:'GasCabinet',ko:'공정 가스 공급장치',no:'GC-01',x:-6.5,z:7.5,ry:180,b:gas,k:['STATUS','PRESS','GAS'],d:'공정 가스를 보관하고 배관으로 공급'},
{id:'Scrubber',ko:'배기 / 스크러버',no:'SCR-01',x:0,z:7.5,ry:180,b:scrubber,k:['STATUS','FLOW','POWER'],d:'공정 배기를 처리하는 배기 처리 장치'},
{id:'Chiller',ko:'냉각장치',no:'CH-01',x:6.5,z:7.5,ry:180,b:chiller,k:['STATUS','TEMP','PRESS'],d:'장비에 냉각수를 순환 공급하는 산업용 칠러'}];
EQ.forEach(e=>e.en=e.en||e.id.replace(/([A-Z])/g,' $1').trim());
const STATE={normal:['정상',0x2ecc71],running:['작동 중',0x3aa0ff],standby:['대기',0xffd23f],warning:['경고',0xff8a00],maint:['점검 필요',0xff3b3b]};
const TW={};EQ.forEach(e=>TW[e.id]={state:'standby',vals:{},leds:[],tower:[],screens:[],anim:null});
let focus=null;

/* ================= 재질 / 텍스처 ================= */
const S=(c,m,r,o)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,...o});
const B=o=>new THREE.MeshBasicMaterial(o);
const tx=(w,h,f,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t};
const M={white:S(0xf0f3f5,.1,.5),gray:S(0xcdd3d8,.25,.5),dark:S(0x3a4149,.6,.5),steel:S(0xd3d8dc,.9,.3),alu:S(0xb6bdc4,.85,.4),black:S(0x14171b,.2,.6),
glass:S(0xcfeaf5,0,.05,{transparent:true,opacity:.2,depthWrite:false}),smoke:S(0x46586a,0,.1,{transparent:true,opacity:.5,depthWrite:false}),
yellow:S(0xf2c400,.3,.5),blue:S(0x2f7fd1,.4,.45),lblue:S(0x6db8f0,.4,.45),red:S(0xd23b2f,.3,.5),green:S(0x2e9e5b,.3,.5),wafer:S(0x8fa4c4,.95,.12),navy:S(0x1f3a63,.4,.5)};
M.dial=B({map:tx(64,64,x=>{x.fillStyle='#fff';x.fillRect(0,0,64,64);x.strokeStyle='#222';x.lineWidth=3;x.beginPath();x.arc(32,32,26,.8*Math.PI,2.2*Math.PI);x.stroke();x.strokeStyle='#d22';x.beginPath();x.moveTo(32,32);x.lineTo(46,22);x.stroke()})});
M.hazard=B({map:tx(128,32,x=>{x.fillStyle='#f2c400';x.fillRect(0,0,128,32);x.fillStyle='#111';for(let i=-2;i<10;i++){x.beginPath();x.moveTo(i*16,32);x.lineTo(i*16+16,32);x.lineTo(i*16+32,0);x.lineTo(i*16+16,0);x.fill()}},1)});
M.warn=B({transparent:true,map:tx(64,64,x=>{x.fillStyle='#f2c400';x.beginPath();x.moveTo(32,4);x.lineTo(60,58);x.lineTo(4,58);x.closePath();x.fill();x.fillStyle='#111';x.font='bold 34px sans-serif';x.textAlign='center';x.fillText('!',32,52)})});
M.disp=B({map:tx(64,32,x=>{x.fillStyle='#051';x.fillRect(0,0,64,32);x.fillStyle='#4f8';x.font='bold 20px monospace';x.fillText('----',6,24)})});
M.line=B({color:0xf2c400});

/* ================= 모델링 도구 (Kit) ================= */
const add=(g,geo,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o};
const box=(g,m,w,h,d,x,y,z,r=.012)=>{const s=Math.min(w,h,d);return add(g,s<.05?new THREE.BoxGeometry(w,h,d):new RoundedBoxGeometry(w,h,d,1,Math.min(r,s/2.5)),m,x,y,z)};
const cyl=(g,m,r1,r2,h,x,y,z,ax='y',s=18)=>{const o=add(g,new THREE.CylinderGeometry(r1,r2,h,s),m,x,y,z);if(ax=='x')o.rotation.z=Math.PI/2;if(ax=='z')o.rotation.x=Math.PI/2;return o};
const tor=(g,m,r,t,x,y,z,ry=0)=>{const o=add(g,new THREE.TorusGeometry(r,t,6,14),m,x,y,z);o.rotation.y=ry;return o};
function pipe(g,m,P,r){const Y=new THREE.Vector3(0,1,0);P.forEach((p,i)=>{const b=new THREE.Vector3(...p);if(i){const a=new THREE.Vector3(...P[i-1]),d=b.clone().sub(a),L=d.length(),c=add(g,new THREE.CylinderGeometry(r,r,L,8),m);c.position.copy(a).addScaledVector(d,.5);c.quaternion.setFromUnitVectors(Y,d.normalize())}if(i&&i<P.length-1)add(g,new THREE.SphereGeometry(r*1.05,8,6),m,...p)})}
const bolts=(g,x,y,z,w,h,ax='z')=>{(g.userData.bolts||(g.userData.bolts=[])).push(...[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>ax=='z'?[x+a*w/2,y+b*h/2,z,'z']:ax=='x'?[x,y+b*h/2,z+a*w/2,'x']:[x+a*w/2,y,z+b*h/2,'y']))};
const gauge=(g,x,y,z)=>{cyl(g,M.steel,.05,.05,.04,x,y,z,'z',16);add(g,new THREE.CircleGeometry(.042,16),M.dial,x,y,z+.021)};
const warnLabel=(g,x,y,z,ry=0)=>{add(g,new THREE.PlaneGeometry(.14,.14),M.warn,x,y,z).rotation.y=ry};
function plate(g,t,w,h,x,y,z,ry=0,bg='#f2f4f5',fg='#111'){const W=512,H=Math.round(W*h/w);const o=add(g,new THREE.PlaneGeometry(w,h),B({map:tx(W,H,(c)=>{c.fillStyle=bg;c.fillRect(0,0,W,H);c.fillStyle=fg;c.font='bold '+Math.round(H*.55)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t,W/2,H/2)})}),x,y,z);o.rotation.y=ry;return o}
function wafers(g,x,y,z,n,p,r=.15){const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(r,r,.004,20),M.wafer,n),m=new THREE.Matrix4();for(let i=0;i<n;i++)im.setMatrixAt(i,m.makeTranslation(x,y+i*p,z));g.add(im)}
function shell(g,m,w,h,d,x,y,z,t=.05){box(g,m,w,h,t,x,y,z-d/2+t/2);box(g,m,t,h,d,x-w/2+t/2,y,z);box(g,m,t,h,d,x+w/2-t/2,y,z);box(g,m,w,t,d,x,y+h/2-t/2,z);box(g,m,w,t,d,x,y-h/2+t/2,z);
box(g,M.glass,w-.12,h-.12,.01,x,y,z+d/2-.02);[-1,1].forEach(s=>box(g,M.alu,.06,h,.06,x+s*(w/2-.03),y,z+d/2-.03))}
/* 상태 연동 요소 (LED / 시그널 타워 / 화면) : dyn=병합 제외 */
function led(g,id,x,y,z){const o=add(g,new THREE.SphereGeometry(.015,8,6),B({color:0xffd23f}),x,y,z);o.userData.dyn=true;TW[id].leds.push(o)}
function tower(g,id,x,y,z){cyl(g,M.alu,.02,.02,.5,x,y+.25,z,'y',8);[0xff3030,0xffc800,0x30ff60].forEach((c,i)=>{const m=B({color:c});cyl(g,m,.05,.05,.08,x,y+.52+i*.09,z,'y',12).userData.dyn=true;TW[id].tower.push(m)})}
function screen(g,id,w,h,x,y,z,ry=0){const c=document.createElement('canvas');c.width=256;c.height=160;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Group();s.position.set(x,y,z);s.rotation.y=ry;s.userData.dyn=true;g.add(s);box(s,M.black,w+.04,h+.04,.03,0,0,0);add(s,new THREE.PlaneGeometry(w,h),B({map:t}),0,0,.017);TW[id].screens.push({t,c})}
function finish(g){const Bs=g.userData.bolts||[];if(Bs.length){const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(.011,.011,.008,6),M.steel,Bs.length),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),one=new THREE.Vector3(1,1,1);Bs.forEach((b,i)=>{e.set(b[3]=='z'?Math.PI/2:0,0,b[3]=='x'?Math.PI/2:0);m.compose(new THREE.Vector3(b[0],b[1],b[2]),q.setFromEuler(e),one);im.setMatrixAt(i,m)});g.add(im)}
g.updateMatrixWorld(true);const by=new Map(),rm=[];
g.traverse(o=>{if(!o.isMesh||o.isInstancedMesh)return;for(let p=o;p&&p!==g;p=p.parent)if(p.userData.dyn)return;if(!by.has(o.material))by.set(o.material,[]);by.get(o.material).push(o.geometry.clone().applyMatrix4(o.matrixWorld));rm.push(o)});
rm.forEach(o=>o.parent.remove(o));by.forEach((l,m)=>{const mg=mergeGeometries(l);if(mg)g.add(new THREE.Mesh(mg,m))});return g}
/* 다관절 로봇 암 (관절 그룹 = 애니메이션 가능) */
function armRig(g,s,x,y,z){const r=new THREE.Group();r.position.set(x,y,z);r.userData.dyn=true;g.add(r);const l1=.7*s,l2=.6*s;
cyl(r,M.steel,.11*s,.11*s,.2*s,0,0,0);box(r,M.white,l1,.1*s,.14*s,l1/2,.1*s,0);
const j2=new THREE.Group();j2.position.set(l1,.1*s,0);r.add(j2);cyl(j2,M.steel,.09*s,.09*s,.18*s,0,0,0);box(j2,M.white,l2,.09*s,.12*s,l2/2,.09*s,0);
const j3=new THREE.Group();j3.position.set(l2,.09*s,0);j2.add(j3);cyl(j3,M.dark,.07*s,.07*s,.14*s,0,0,0);
[-1,1].forEach(a=>box(j3,M.alu,.3*s,.012,.03*s,.15*s,.05*s,a*.03*s));cyl(j3,M.wafer,.15*s,.15*s,.006,.2*s,.065*s,0);
return t=>{const on=t!=null;r.rotation.y=on?Math.sin(t*.5)*1.1:.3;j2.rotation.y=on?Math.sin(t*.9)*1.0:-.6;j3.rotation.y=on?-Math.sin(t*.9)*.8:.3}}
const animOf=(id,f)=>{TW[id].anim=(t,run)=>f(run?t:null)};

/* ================= 장비 9종 ================= */
function loadPort(id){const g=new THREE.Group();
box(g,M.gray,2.5,1.9,.5,0,.95,-.3);box(g,M.dark,2.5,.12,.8,0,.06,-.15);
[-.6,.6].forEach(x=>{box(g,M.steel,.8,.04,.7,x,.95,.3);box(g,M.black,.52,.5,.03,x,1.3,-.04);
box(g,M.smoke,.36,.34,.4,x,1.14,.3);box(g,M.white,.34,.32,.02,x,1.14,.09);box(g,M.dark,.12,.03,.1,x,1.33,.3);cyl(g,M.steel,.02,.02,.05,x,1.37,.3,'y',8);wafers(g,x,1.0,.3,13,.022,.14);
[-.1,0,.1].forEach(k=>led(g,id,x+k,.98,.64));bolts(g,x,1.3,-.055,.52,.5)});
box(g,M.white,.35,.6,.25,1.45,1.0,-.15);screen(g,id,.28,.18,1.45,1.25,0);tower(g,id,1.1,1.9,-.3);
plate(g,'LP-01',.3,.1,-1.0,1.75,-.052);warnLabel(g,1.1,.4,-.052);pipe(g,M.black,[[-1,.1,-.55],[-1,.1,-1]],.02);return finish(g)}

function cassette(id){const g=new THREE.Group();
box(g,M.steel,1.9,.05,.9,0,.98,0);box(g,M.gray,1.8,.6,.8,0,.65,0);[-1,1].forEach(a=>[-1,1].forEach(b=>box(g,M.alu,.06,.4,.06,a*.85,.2,b*.38)));box(g,M.dark,1.8,.06,.8,0,.05,0);
[-.45,.45].forEach(x=>{box(g,M.alu,.36,.03,.36,x,1.02,0);box(g,M.alu,.01,.34,.34,x-.18,1.2,0);box(g,M.alu,.01,.34,.34,x+.18,1.2,0);box(g,M.alu,.36,.02,.36,x,1.38,0);box(g,M.alu,.36,.34,.01,x,1.2,-.18);wafers(g,x,1.06,0,25,.012)});
box(g,M.glass,1.8,.5,.85,0,1.25,0);[-1,1].forEach(a=>[-1,1].forEach(b=>box(g,M.alu,.04,.5,.04,a*.9,1.25,b*.42)));box(g,M.alu,1.84,.03,.04,0,1.5,.42);
[-.1,0,.1].forEach(k=>led(g,id,.75+k,.8,.41));screen(g,id,.3,.19,.65,.8,.45);tower(g,id,-.85,1.5,-.38);plate(g,'CS-01',.3,.1,-.6,.7,.405);warnLabel(g,.3,.7,.405);bolts(g,0,.65,.405,1.7,.5);return finish(g)}

function unloader(id){const g=new THREE.Group();
box(g,M.dark,2.2,.12,.9,0,.06,0);shell(g,M.white,1.3,1.6,.8,-.45,.9,0);const pose=armRig(g,.6,-.45,.8,0);box(g,M.dark,.3,.5,.3,-.45,.35,0);
box(g,M.gray,.6,1.6,.8,.5,.9,0);box(g,M.steel,.5,.04,.6,.5,.95,.5);box(g,M.smoke,.36,.34,.4,.5,1.14,.5);wafers(g,.5,1.0,.5,13,.022,.14);[-.1,.1].forEach(k=>led(g,id,.5+k,.98,.8));
for(let i=0;i<9;i++)cyl(g,M.alu,.03,.03,.5,.9,.16,.9+i*.16,'x',8);
add(g,new THREE.PlaneGeometry(.5,.5),B({transparent:true,map:tx(128,128,c=>{c.fillStyle='rgba(30,140,60,.9)';c.fillRect(0,0,128,128);c.fillStyle='#fff';c.beginPath();c.moveTo(64,10);c.lineTo(110,70);c.lineTo(80,70);c.lineTo(80,118);c.lineTo(48,118);c.lineTo(48,70);c.lineTo(18,70);c.fill()})}),.4,.012,1.9).rotation.x=-Math.PI/2;
screen(g,id,.28,.18,.95,1.3,.05);tower(g,id,-1.0,1.7,-.3);plate(g,'UL-01  EXIT',.5,.12,.5,1.75,.405);animOf(id,pose);return finish(g)}

function furnace(id){const g=new THREE.Group();
box(g,M.dark,5.2,.14,2.6,0,.07,0);shell(g,M.white,2.5,2.8,2.4,-1.3,1.54,0);
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>cyl(g,M.steel,.012,.012,1.0,-1.3+a*.16,1.0,-.3+b*.1,'y',6));cyl(g,M.steel,.2,.2,.04,-1.3,.5,-.3);wafers(g,-1.3,.6,-.3,40,.02);box(g,M.steel,.12,2.4,.12,-2.1,1.5,-.9);
const pose=armRig(g,.55,-.65,.9,.5);box(g,M.dark,.25,.6,.25,-.65,.55,.5);
box(g,M.white,2.6,3.0,2.4,1.25,1.64,0);
cyl(g,M.steel,.82,.82,.8,1.3,3.4,-.2,'y',28);[3.15,3.4,3.65].forEach(y=>cyl(g,M.dark,.85,.85,.05,1.3,y,-.2,'y',28));cyl(g,M.steel,.3,.3,.35,1.3,3.95,-.2);cyl(g,M.steel,.36,.36,.05,1.3,4.1,-.2);
box(g,M.dark,.015,2.6,.02,1.25,1.7,1.205);[.95,1.55].forEach(x=>cyl(g,M.steel,.015,.015,.3,x,1.5,1.24));
for(let i=0;i<8;i++)box(g,M.dark,.9,.02,.03,.6,.3+i*.07,1.215);
box(g,M.dark,.9,.55,.06,.6,2.4,1.23);for(let i=0;i<4;i++)add(g,new THREE.PlaneGeometry(.16,.08),M.disp,.27+i*.22,2.5,1.262);[0,1,2,3].forEach(i=>led(g,id,.3+i*.2,2.25,1.262));
[[.95,2.2],[1.55,2.2]].forEach(([x,y])=>box(g,M.alu,.5,.4,.02,x+.35,y,1.215));

/* ================= VR (Cardboard) : 좌/우 분할 + 자이로 + 가로 보정 ================= */
const vr={on:false,fl:false,need:true,dev:new THREE.Quaternion(),off:new THREE.Quaternion(),roll:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2)},DG=Math.PI/180,AY=new THREE.Vector3(0,1,0);
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function devQ(e){
  if(e.alpha == null) return;
  const alpha = e.alpha ? e.alpha * DG : 0;
  const beta = e.beta ? e.beta * DG : 0;
  const gamma = e.gamma ? e.gamma * DG : 0;
  const orient = (screen.orientation ? screen.orientation.angle : window.orientation || 0) * DG;

  euler.set(beta, alpha, -gamma, 'ZXY');
  vr.dev.setFromEuler(euler);
  vr.dev.multiply(q1);
  q0.setFromAxisAngle(zee, -orient);
  vr.dev.multiply(q0);

  if(vr.need){
    vr.need = false;
    vr.off.setFromAxisAngle(AY, -new THREE.Euler().setFromQuaternion(vr.dev, 'YXZ').y);
  }
}
const size=()=>vr.fl?[innerHeight,innerWidth]:[innerWidth,innerHeight];
function resize(){const[w,h]=size();renderer.setSize(w,h);camera.aspect=(vr.on?w/2:w)/h;camera.updateProjectionMatrix()}
function fit(){vr.fl=vr.on&&innerWidth<innerHeight;document.body.classList.toggle('fl',vr.fl);resize()}
async function setVR(on){vr.on=on;document.body.classList.toggle('vr',on);if(on){vr.need=true;const D=window.DeviceOrientationEvent;if(D&&D.requestPermission){try{if(await D.requestPermission()=='granted')addEventListener('deviceorientation',devQ)}catch(e){}}else addEventListener('deviceorientation',devQ);
document.documentElement.requestFullscreen?.().catch(()=>{});screen.orientation?.lock?.('landscape').catch(()=>{});addEventListener('orientationchange',fit)}else{document.exitFullscreen?.().catch(()=>{});removeEventListener('orientationchange',fit)}fit()}
document.getElementById('vr').onclick=()=>setVR(true);document.getElementById('exit').onclick=()=>setVR(false);addEventListener('resize',fit);
function eye(o,x,w,h){const p=camera.position.clone();camera.position.add(new THREE.Vector3(o,0,0).applyQuaternion(camera.quaternion));renderer.setViewport(x,0,w,h);renderer.setScissor(x,0,w,h);renderer.render(scene,camera);camera.position.copy(p)}

/* ================= 루프 ================= */
const clock=new THREE.Clock(),fw=new THREE.Vector3(),rt=new THREE.Vector3(),ORDER=['normal','running','standby','warning','maint'];
fit();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime;
if(vr.on)camera.quaternion.copy(vr.off).multiply(vr.dev).multiply(vr.roll);else camera.rotation.set(player.pitch,player.yaw,0,'YXZ');
camera.getWorldDirection(fw);fw.y=0;fw.normalize();rt.set(-fw.z,0,fw.x);
const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+(walk?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),sp=(keys.ShiftLeft?3.2:1.6)*dt;
if(f||s)move((fw.x*f+rt.x*s)*sp,(fw.z*f+rt.z*s)*sp);camera.position.copy(player.pos);
if(demo&&t-demoT>2.5){demoT=t;EQ.forEach((e,i)=>digitalTwin.setStatus(e.id,ORDER[(Math.floor(t/2.5)+i)%5]))}
EQ.forEach(e=>{const w=TW[e.id];w.anim&&w.anim(t,w.state=='running');w.leds.forEach(l=>l.visible=w.state!='running'||Math.floor(t*3)%2==0)});
gaze(dt,t);
if(vr.on){const[w,h]=size();renderer.setScissorTest(true);eye(-.032,0,w/2,h);eye(.032,w/2,w/2,h)}else{renderer.setScissorTest(false);const[w,h]=size();renderer.setViewport(0,0,w,h);renderer.render(scene,camera)}});
</script></body></html>
